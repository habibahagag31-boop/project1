<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Booking Form</h1>
    <form>
        <div>
            <label for="Name">Name</label>
            <input type="text" required>
        </div>
        <div>
            <label for="Email">Email</label>
            <input type="Email" required>
        </div>
        <div>
            <label for="phone">phone</label>
            <input type="number" required>
        </div>
        <div>
            <label for="date">Arrival Date</label>
            <input type="date" required>
        </div>
        <div>
            <label for="date">Departure Date</label>
            <input type="date" required>
        </div>
        <div>
            <label for="room">Room Date</label>
            <select name="room" id="room" required>
                <option value="">--select Room--</option>
            </select>
        </div>
        <div>
            <input type="checkbox" id="break">
            <label for="break">Breakfast</label>
            <input type="checkbox" id="free">
            <label for="free">Free WiFi</label>
        </div>
        <div>
            <input type="radio" id="rad">
            <label for="rad">Cash</label>
            <input type="radio" id="car">
            <label for="car">card</label>
        </div>
        <div>
            <label for="id">Upload Id</label>
            <input type="file">
        </div>
        <div>
            <label for="notes">Notes</label>
            <textarea name="notes" id="notes"></textarea>
        </div>
        <div>
            <button type="submit">Book Now</button>
        </div>
    </form>
</body>
</html>
